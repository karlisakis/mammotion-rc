<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0f14">
  <title>Luba Remote</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.23.0.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>
</head>
<body>

  <header id="app-header">
    <select id="mower" aria-label="Select mower"></select>
    <button id="reconnect" class="btn btn-header" title="Reconnect to the mower">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      <span>Reconnect</span>
    </button>
    <a href="/onboarding" id="settings-link" class="btn btn-header btn-icon" title="Re-scan / edit mowers" aria-label="Settings">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
        <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
        <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/>
        <line x1="17" y1="16" x2="23" y2="16"/>
      </svg>
    </a>
    <div class="chips">
      <span id="status" class="chip chip-status">connecting…</span>
      <span id="mower-status" class="chip chip-state" title="Mower state"></span>
      <span id="battery" class="chip chip-battery" title="Mower battery"></span>
    </div>
  </header>

  <main>
    <!-- Fault message on its own full-width line so it wraps instead of
         truncating in a cramped row (unreadable on a phone).  Clamped to two
         lines; tap to expand the full text. -->
    <div id="mower-error" class="fault-banner" role="alert"></div>

    <section id="video-section">
      <div id="video-frame">
        <div id="video"></div>

        <div id="cam-placeholder" aria-hidden="true">
          <svg class="ico ico-big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <span>Camera off</span>
        </div>

        <div id="cam-spinner" aria-hidden="true">
          <span class="spinner"></span>
          <span>Connecting…</span>
        </div>

        <!-- Heading-up compass, overlaid on the video while the camera is live.
             The arrow is fixed pointing up (= the camera's forward view); the ring
             (with N/E/S/W) rotates so N shows where geographic north is. -->
        <div id="compass" class="compass" hidden aria-hidden="true">
          <div class="compass-ring" id="compass-ring">
            <span class="cardinal cardinal-n">N</span>
            <span class="cardinal cardinal-e">E</span>
            <span class="cardinal cardinal-s">S</span>
            <span class="cardinal cardinal-w">W</span>
          </div>
          <div class="compass-arrow"></div>
          <div class="compass-readout" id="compass-readout">—</div>
        </div>
      </div>

      <div class="camera-controls">
        <button id="cam-start" class="btn primary">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
          <span>Start Camera</span>
        </button>
        <button id="cam-stop" class="btn" disabled>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <span>Stop Camera</span>
        </button>
      </div>
    </section>

    <section id="controls">
      <!-- Wrapper keeps the zone's parent non-flex: nipplejs's parentIsFlex
           heuristic otherwise drops the box offset and places the stick far
           from the finger (offset by the zone's distance from the page top). -->
      <div id="joystick-wrap">
        <div id="joystick-zone">
          <div class="joy-rings" aria-hidden="true"></div>
          <span class="joy-hint" aria-hidden="true">Hold &amp; drag to drive</span>
          <span id="drive-indicator" aria-hidden="true">Driving</span>
        </div>
      </div>

      <div class="actions">
        <button id="pause" class="btn">
          <svg class="ico" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
            <rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>
          </svg>
          <span>Pause</span>
        </button>
        <button id="resume" class="btn">
          <svg class="ico" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
            <polygon points="6 3 21 12 6 21 6 3"/>
          </svg>
          <span>Resume</span>
        </button>
        <button id="dock" class="btn">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Dock</span>
        </button>
        <button id="undock" class="btn">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 21h18"/><path d="M12 17V5"/><polyline points="6 11 12 5 18 11"/>
          </svg>
          <span>Undock</span>
        </button>
        <button id="light" class="btn span-2">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18h6"/><path d="M10 21h4"/>
            <path d="M12 3a6 6 0 0 0-3.6 10.8c.7.55 1.1 1.33 1.1 2.2h5c0-.87.4-1.65 1.1-2.2A6 6 0 0 0 12 3z"/>
          </svg>
          <span id="light-label">Light On</span>
        </button>
      </div>
    </section>

    <section id="mow-panel">
      <h2 class="panel-title">Mowing</h2>

      <!-- Live blade telemetry: blade-chip is the mower's OWN sensor bit for
           "disc rotating" (ground truth, not our last command); rpm-chip shows
           the live cutter RPM from the ~6 s cutter-mode probe. -->
      <div class="mow-status">
        <span class="chip" id="blade-chip">Blades: —</span>
        <span class="chip" id="rpm-chip" hidden></span>
        <span class="chip" id="progress-chip" hidden></span>
      </div>

      <div class="actions">
        <button id="start-job" class="btn primary">
          <svg class="ico" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
            <polygon points="6 3 21 12 6 21 6 3"/>
          </svg>
          <span>Start Mowing</span>
        </button>
        <button id="cancel-job" class="btn">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          <span>Cancel Job</span>
        </button>
        <!-- Manual mowing: blades while joystick-driving.  Blades On requires a
             second confirming tap (see app.js); the mower's own lift/tilt/bumper
             protections still cut the blades regardless of what we send. -->
        <button id="blades-on" class="btn btn-blades">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 9V2M12 22v-7M9 12H2M22 12h-7" transform="rotate(45 12 12)"/>
          </svg>
          <span id="blades-on-label">Blades On</span>
        </button>
        <button id="blades-off" class="btn">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <span>Blades Off</span>
        </button>
      </div>

      <div class="setting">
        <div class="setting-head">
          <span>Blade speed</span>
        </div>
        <div class="segment" id="cutter-mode-seg" role="group" aria-label="Blade speed preset">
          <button class="seg-btn" data-mode="1">Eco</button>
          <button class="seg-btn" data-mode="0">Normal</button>
          <button class="seg-btn" data-mode="2">Fast</button>
        </div>
      </div>

      <div class="setting">
        <div class="setting-head">
          <span>Cutting height</span>
          <span class="setting-val" id="height-val">— mm</span>
        </div>
        <!-- Fallback range only.  Overridden by /api/status `limits` when the
             mower reports a model pymammotion has an entry for — this one
             (Luba-VA / HM442) has none, so these defaults are what you get.
             30-70 is the common Luba 2 range; the mower reporting 50 mm is
             consistent with it.  Narrow this once hardware testing pins the
             real range and step (see docs/blade-height-findings.md). -->
        <input type="range" id="height-slider" min="30" max="70" step="5" value="50"
               aria-label="Cutting height in millimetres">
        <!-- What the MOWER reports, kept separate from the slider (which is a
             command input).  Shows "adjusting…" while the height motor runs,
             then the settled value, tinted green when it matches the slider. -->
        <div class="setting-sub" id="height-report" aria-live="polite"></div>
      </div>
      <div class="setting">
        <div class="setting-head">
          <span>Drive speed</span>
          <span class="setting-val" id="speed-val">— m/s</span>
        </div>
        <input type="range" id="speed-slider" min="0.2" max="0.6" step="0.05" value="0.4"
               aria-label="Working speed in metres per second">
      </div>
    </section>

    <section id="log-drawer">
      <button id="log-toggle" aria-expanded="false" aria-controls="log">
        <span>Diagnostics</span>
        <svg class="ico caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <pre id="log"></pre>
    </section>
  </main>

  <!-- Transient action feedback (success/failure), floated above the STOP bar. -->
  <div id="toast-region" role="status" aria-live="polite"></div>

  <!-- Emergency stop: fixed to the viewport bottom so it can never scroll away. -->
  <div id="stop-bar">
    <button id="stop" class="btn-stop">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86"/>
      </svg>
      <span>STOP</span>
    </button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
